# Minimal Supabase config for deploying Edge Functions from this repo.
# Set the project ref at deploy time: npx supabase functions deploy --project-ref YOUR_PROJECT_REF
#
# Auth email templates below apply to local `supabase start` / Mailpit.
# Hosted project: run `node scripts/build-auth-emails.mjs --push` with SUPABASE_ACCESS_TOKEN.

[functions.coach]
verify_jwt = true

[functions.garmin-sync]
verify_jwt = true

[functions.strava-sync]
verify_jwt = true

[functions.strava-webhook]
verify_jwt = false

[auth.email.template.confirmation]
subject = "Confirm your Training Pal email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Training Pal password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Training Pal sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You’re invited to Training Pal"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new Training Pal email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} is your Training Pal code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Training Pal password was changed"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Training Pal email was changed"
content_path = "./supabase/templates/email_changed_notification.html"
